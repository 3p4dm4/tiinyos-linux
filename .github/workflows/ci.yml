# Quality gate for tiinyos-linux (AI_Academy-hub pattern, reduced to the perimeter).
#
# Phase 1: OBSERVATION (not required). Regime A: branch protection on main
# with this check REQUIRED + enforce_admins — no exceptions.
#
# The at-risk surface of this repo is not the app (it is vendor): it is the
# PATCHES on the bundle anchors. If the upstream TiinyOS bundle changes, the
# anchors disappear and the patch tools exit with "bundle drifted"; the
# functional tests here catch it before a user finds a broken install.sh.
name: ci

on:
  pull_request:
    branches: [main]
    # ready_for_review is not a default type: without it, marking a draft
    # "ready" would not start the full run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: syntax · py-compile · patch-tools · secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: where this gate ran
        run: 'echo "Runner: ${RUNNER_NAME} (${RUNNER_ENVIRONMENT})" >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: the changelog check diffs against the base branch
      - name: changelog updated when code changes (PRs)
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          code="$(grep -E '^(src/|tools/|pcsvr-rs/|standalone/|install\.sh|update\.sh|build_clone\.sh|fetch_control_panel\.sh)' <<<"$changed" || true)"
          if [[ -n "$code" ]] && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "Code changed but CHANGELOG.md was not updated (add a line under Unreleased):"
            echo "$code"
            exit 1
          fi
      - name: shell syntax gate (install/deploy scripts)
        run: |
          # Loop, not glob: `bash -n a.sh b.sh` only checks the first file.
          for f in install.sh update.sh build_clone.sh fetch_control_panel.sh tools/launch.sh tools/build_pcsvr.sh; do bash -n "$f"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: python compile (tools + tests)
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: patch tools functional tests (fixture, no vendor bundle)
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JS syntax gate (src/m3_*)
        run: |
          for f in src/*.js; do node --check "$f"; done
      - name: pcsvr-rs (Linux PC service) — clippy + tests, leak test included
        working-directory: pcsvr-rs
        run: |
          cargo clippy --offline --all-targets -- -D warnings
          cargo test --offline -- --test-threads=1
      - name: secrets scan (fail-closed)
        run: bash tools/check_secrets.sh
