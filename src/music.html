<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' data:; media-src file:; connect-src 'none'">
<title>Music Studio</title>
<link rel="stylesheet" href="performance.css">
<link rel="stylesheet" href="music.css">
</head>
<body>
<h1>Music Studio — ACE-Step XL on device</h1>
<div class="sub">idea → writer model → caption + lyrics → take → play · audio saved in ~/Musica/tiiny</div>

<div class="card statusbar" id="status">
  <span class="note">checking device…</span>
</div>

<div class="cols">
  <div class="col">
    <h2>Idea</h2>
    <textarea id="idea" rows="4" placeholder="es. brano nordico con vocalizzi femminili, crescendo di tamburi, senza parole"></textarea>
    <p><button id="btn-write">✨ Write prompt</button> <span id="writer-note" class="note"></span></p>

    <h2>Caption</h2>
    <textarea id="caption" rows="8" placeholder="generated by ✨ or write your own"></textarea>
    <h2>Lyrics</h2>
    <textarea id="lyrics" rows="8" placeholder="[intro] … [stop] — or (instrumental)"></textarea>

    <h2>Reference (optional)</h2>
    <select id="refs"><option value="">— none —</option></select>
    <span class="note">folder ~/Musica/references</span>

    <div class="row">
      <label>Seconds <input id="seconds" type="number" value="180" min="30" max="600" step="30"></label>
      <label>Takes <input id="takes" type="number" value="1" min="1" max="4"></label>
      <button id="btn-gen" class="primary">Generate</button>
    </div>
    <div id="progress" class="hidden">
      <div class="bar"><i id="pbar"></i></div>
      <div class="note" id="pnote"></div>
    </div>
  </div>

  <div class="col">
    <h2>Takes</h2>
    <div id="takes-list" class="note">nothing generated yet in this session</div>
  </div>
</div>

<script src="m3music/status.js"></script>
<script src="m3music/studio.js"></script>
<script src="m3music/main.js"></script>
</body>
</html>
