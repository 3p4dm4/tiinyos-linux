<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' data:; media-src file:; connect-src 'none'">
<title>Music Lab</title>
<link rel="stylesheet" href="performance.css">
<link rel="stylesheet" href="music.css">
</head>
<body>
<header class="lab-head">
  <div class="lab-title">
    <img src="music-lab.png" alt="" class="lab-logo">
    <div>
      <h1>Music Lab</h1>
      <div class="sub">idea → writer model → caption + lyrics → take → play · saved in ~/Musica/tiiny</div>
    </div>
  </div>
  <div class="card statusbar" id="status"><span class="note">checking device…</span></div>
</header>

<div class="lab-grid">
  <!-- composer -->
  <section class="lab-col">
    <div class="card step">
      <div class="step-n">1</div>
      <div class="step-body">
        <label class="lbl" for="idea">Idea</label>
        <textarea id="idea" rows="3" placeholder="es. brano nordico con vocalizzi femminili, crescendo di tamburi, senza parole"></textarea>
        <div class="step-act">
          <button type="button" id="btn-write">Write prompt</button>
          <span id="writer-note" class="note"></span>
        </div>
      </div>
    </div>

    <div class="card step">
      <div class="step-n">2</div>
      <div class="step-body">
        <label class="lbl" for="caption">Caption</label>
        <textarea id="caption" rows="6" placeholder="generated by the writer or write your own"></textarea>
        <label class="lbl" for="lyrics">Lyrics</label>
        <textarea id="lyrics" rows="6" placeholder="[intro] … [stop] — or (instrumental)"></textarea>
      </div>
    </div>
  </section>

  <!-- studio -->
  <aside class="lab-col">
    <div class="card">
      <label class="lbl" for="refs">Reference <span class="hint">~/Musica/references</span></label>
      <select id="refs" class="fill"><option value="">— none —</option></select>
      <div class="field-grid">
        <label class="fld"><span>Seconds</span><input id="seconds" type="number" value="180" min="30" max="600" step="30"></label>
        <label class="fld"><span>Takes</span><input id="takes" type="number" value="1" min="1" max="4"></label>
      </div>
      <button type="button" id="btn-gen" class="primary fill">Generate</button>
      <div id="progress" class="hidden">
        <div class="bar"><i id="pbar"></i></div>
        <div class="note" id="pnote"></div>
      </div>
    </div>

    <div class="card takes-card">
      <div class="lbl">Takes</div>
      <div id="takes-list" class="empty">Nothing generated yet in this session.</div>
    </div>
  </aside>
</div>

<script src="m3music/status.js"></script>
<script src="m3music/studio.js"></script>
<script src="m3music/main.js"></script>
</body>
</html>
