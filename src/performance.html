<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' data:; connect-src 'none'">
<title>Device</title>
<link rel="stylesheet" href="performance.css">
</head>
<body>

<header>
  <h1>Device</h1>
  <div role="tablist" aria-label="Device sections">
    <button type="button" role="tab" id="tab-status" aria-selected="true" aria-controls="p-status">Status</button>
    <button type="button" role="tab" id="tab-models" aria-selected="false" aria-controls="p-models" tabindex="-1">Models</button>
    <button type="button" role="tab" id="tab-usage" aria-selected="false" aria-controls="p-usage" tabindex="-1">Usage</button>
    <button type="button" role="tab" id="tab-power" aria-selected="false" aria-controls="p-power" tabindex="-1">Power</button>
  </div>
  <div class="spacer"></div>
  <span class="note" id="dev-ver">Tiiny Pocket</span>
  <button type="button" id="theme" aria-label="Theme: follows the system. Press to change">Theme: system</button>
</header>

<!-- Persistent strip: reach + the one request + the one running task.
     Always visible; the same two facts go to the Floating Ball tooltip and the tray. -->
<div class="strip" id="strip" aria-live="polite">
  <span id="strip-reach"><span class="st idle">Reading…</span></span>
  <span class="task" id="strip-req"></span>
  <span class="spacer"></span>
  <span class="task" id="strip-task"></span>
  <span class="meter" id="strip-meter" aria-hidden="true"><i></i></span>
  <button type="button" id="strip-details" data-tab="tab-status">Details</button>
</div>

<main>

  <div role="tabpanel" id="p-status" aria-labelledby="tab-status">
    <!-- filled by m3perf/status.js -->
  </div>

  <div role="tabpanel" id="p-models" aria-labelledby="tab-models" hidden>
    <!-- filled by m3perf/models.js -->
  </div>

  <div role="tabpanel" id="p-usage" aria-labelledby="tab-usage" hidden>
    <!-- filled by m3perf/usage.js + chart.js -->
  </div>

  <div role="tabpanel" id="p-power" aria-labelledby="tab-power" hidden>
    <!-- filled by m3perf/power.js -->
  </div>

</main>

<script src="m3perf/helpers.js"></script>
<script src="m3perf/tabs.js"></script>
<script src="m3perf/bench.js"></script>
<script src="m3perf/status.js"></script>
<script src="m3perf/models.js"></script>
<script src="m3perf/chart.js"></script>
<script src="m3perf/usage.js"></script>
<script src="m3perf/power.js"></script>
<script src="m3perf/data.js"></script>
<script src="m3perf/main.js"></script>
</body>
</html>
